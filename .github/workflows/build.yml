name: Build CinderJoyTap Mod
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download Stardew Valley Reference Assemblies
        run: |
          mkdir -p $HOME/stardew_refs
          # -f makes curl fail on HTTP errors (so we don't pipe HTML into tar)
          curl -fL https://github.com/Pathoschild/StardewValley-ReferenceAssemblies/archive/refs/heads/main.tar.gz | tar -xz -C $HOME/stardew_refs --strip-components=1

      - name: Build Mod (Release)
        run: dotnet build -c Release -p:GamePath="$HOME/stardew_refs"

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinderJoyTap-Release
          path: |
            **/bin/Release/net6.0/CinderJoyTap.dll
            **/manifest.json
