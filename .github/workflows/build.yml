name: Diagnose CI problems
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo summary
        run: |
          echo "Repo root listing:"
          ls -la
          echo
          echo "Top-level files:"
          ls -la | sed -n '1,200p'
          echo
          echo "Find csproj, manifest, and .yml files:"
          find . -maxdepth 4 -type f \( -name "*.csproj" -o -name "manifest.json" -o -name "*.yml" -o -name "*.yaml" \) -print

      - name: Print csproj and manifest (if present)
        run: |
          for f in $(find . -maxdepth 6 -type f -name "*.csproj" -o -name "manifest.json"); do
            echo "==== FILE: $f ===="
            sed -n '1,200p' "$f"
            echo
          done || true

      - name: Dotnet info
        run: |
          dotnet --info || true

      - name: Try dotnet restore (diagnostic)
        run: |
          set -e
          dotnet restore || echo "restore failed (see log)"

      - name: Try dotnet build (diagnostic)
        run: |
          set -e
          dotnet build -c Release -nologo || echo "build attempted (see log)"